[tools]
rust = "1.96.1"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Type-check mena"
run = "cargo check --locked"

[tasks.test]
description = "Run all mena tests"
run = "cargo test --locked"

[tasks.clippy]
description = "Run strict Clippy across all targets"
run = "cargo clippy --all-targets --locked -- -D warnings -D clippy::pedantic -D clippy::nursery"

[tasks.docs]
description = "Build documentation with warnings denied"
run = "RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --locked"

[tasks.build]
description = "Build the release binary"
run = "cargo build --release --locked"

[tasks.gui-build]
description = "Build the native macOS app"
run = "bash scripts/build-macos.sh"

[tasks.gui-release]
description = "Build the optimized native macOS app"
run = "bash scripts/build-macos.sh release"

[tasks.gui]
description = "Build and open the native macOS app"
run = """
bash scripts/build-macos.sh
open target/macos/Mena.app
"""

[tasks.gui-test]
description = "Test desktop catalogs and the native UI model"
run = """
cargo test --locked --features desktop
bash scripts/build-macos.sh
swift test --package-path macos
"""

[tasks.gui-verify]
description = "Verify CLI, desktop bridge, Swift formatting, native tests, and release build"
run = """
mise run verify
cargo clippy --all-targets --all-features --locked -- -D warnings -D clippy::pedantic -D clippy::nursery
swift format lint --strict --recursive macos/Sources macos/Tests macos/Tools macos/Package.swift
mise run gui-test
mise run gui-release
"""

[tasks.verify]
description = "Run all local verification gates"
run = """
cargo fmt --all -- --check
cargo check --locked
cargo test --locked
cargo clippy --all-targets --locked -- -D warnings -D clippy::pedantic -D clippy::nursery
RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --locked
"""
